<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhậu ngon, mồi phải chuẩn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#fff7ec;--card:#ffffff;--ink:#2a1a10;--mute:#6b5646;--accent:#e8590c;--accent2:#f59f00;--line:#f0dcc4;--shadow:0 12px 40px rgba(120,60,10,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--card:#2a1f18;--ink:#f6ead8;--mute:#c9b5a0;--accent:#ff8a3d;--accent2:#ffc58f;--line:#4a372a;--shadow:0 12px 40px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1b1410;--card:#2a1f18;--ink:#f6ead8;--mute:#c9b5a0;--accent:#ff8a3d;--accent2:#ffc58f;--line:#4a372a;--shadow:0 12px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,Arial,sans-serif;line-height:1.6;overflow-x:hidden}
#bar{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:5px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:20}
.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:64px 24px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(40px,8vw,92px);font-weight:800;line-height:1.08;margin:12px 0;max-width:15ch;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(17px,2.4vw,22px);max-width:640px;color:var(--mute);margin:8px 0 28px}
.tag{font-weight:600;letter-spacing:.14em;font-size:14px;color:var(--accent)}
.float{position:absolute;font-size:clamp(36px,7vw,84px);animation:fl 6s ease-in-out infinite;opacity:.9;user-select:none}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;position:relative;z-index:1}
.chip{border:0;font:inherit;font-weight:600;font-size:15px;background:var(--accent);color:#fff;padding:9px 18px;border-radius:99px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.chip:hover{transform:translateY(-4px) scale(1.05);box-shadow:var(--shadow)}
.scroll{margin-top:36px;color:var(--mute);font-size:14px;animation:fl 2.5s ease-in-out infinite}
main{max-width:1080px;margin:0 auto;padding:0 20px 40px}
.dish{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:56px 0}
.dish:nth-child(even) .art{order:2}
.art{aspect-ratio:1;border-radius:36px;display:flex;align-items:center;justify-content:center;font-size:clamp(120px,22vw,230px);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .4s}
.art::after{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%)}
.art span{position:relative;z-index:1;animation:bob 3.5s ease-in-out infinite;display:block}
.art:hover{transform:rotate(-3deg) scale(1.03)}
.art:hover span{animation-duration:.8s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.06)}}
.num{font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.12em}
.dish h2{font-size:clamp(32px,5vw,52px);line-height:1.1;margin:6px 0 10px}
.dish .sub{font-size:19px;color:var(--mute);font-weight:600;margin:0 0 20px}
.dish ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.dish li{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 52px;position:relative;box-shadow:var(--shadow);transition:transform .25s}
.dish li:hover{transform:translateX(8px)}
.dish li::before{content:"✓";position:absolute;left:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.rv{opacity:0;transform:translateY(36px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.dish li.rv:nth-child(2){transition-delay:.12s}.dish li.rv:nth-child(3){transition-delay:.24s}
footer{text-align:center;padding:72px 24px 96px;background:linear-gradient(180deg,transparent,var(--line))}
footer h2{font-size:clamp(30px,5vw,48px);margin:0 0 10px}
footer p{color:var(--mute);max-width:560px;margin:0 auto 20px}
.cheer{font-size:72px;display:inline-block;cursor:pointer;animation:bob 2s ease-in-out infinite;border:0;background:none}
@media (max-width:780px){.dish{grid-template-columns:1fr;gap:24px;padding:36px 0}.dish:nth-child(even) .art{order:0}.art{max-width:340px;margin:0 auto;width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar"></div>
<header class="hero">
<span class="float" style="left:6%;top:12%;animation-delay:0s">🍺</span>
<span class="float" style="right:8%;top:10%;animation-delay:1s">🦐</span>
<span class="float" style="left:10%;bottom:14%;animation-delay:2s">🍗</span>
<span class="float" style="right:6%;bottom:16%;animation-delay:.5s">🍲</span>
<span class="tag">THỰC ĐƠN DO ĐẦU BẾP SỐ 1 HIỆP BÌNH SUNHI BÌNH CHỌN</span>
<h1>Menu Mồi Nhậu Đỉnh Cao Gửi Thầy BIN Xem Xét</h1>
<p class="lead">Ăn là cuốn, uống là cuồng, vui  tới bến!</p>
<div class="chips" id="chips"></div>
<div class="scroll">Cuộn xuống để xem ↓</div>
</header>
<main id="list"></main>
<footer>
<h2>Chốt bàn, cạn ly!</h2>
<p>Chua cay đủ vị - nóng lạnh đủ đầy.<p></p> MỜI THẦY CHỐT ĐƠN<p></p> (XIN ĐỪNG CHỬI THẦM)</p>
<button class="cheer" id="cheer" aria-label="Cạn ly">🍻</button>
</footer>
<script>
var D=[
["Bò hít","🥩","Hít một miếng, dính cả đời!",["Thịt bò thơm, ngọt, đậm vị, ăn là thấy đã","Giàu đạm, lót dạ tốt cho người uống bia","Dễ gắp, dễ chia, hợp ăn chung cả bàn"],"#ffd8a8,#ff922b"],
["Chân gà sả tắc","🐔","Giòn sần sật, chua cay bất tận!",["Sả tắc chua cay thơm, kích vị mỗi lần nhắp bia","Da giòn, sụn sần sật, càng gặm càng ghiền","Món nguội, dọn sẵn, để lâu vẫn ngon"],"#ffe066,#f59f00"],
["Lẩu Thái","🍲","Húp một miếng lẩu, quên sạch chuyện sầu!",["Nước lẩu chua cay đặc trưng, rất hợp trời mát","Nhúng từng món, ăn nóng đến phút cuối","Nhiều topping, ai thích gì nhúng nấy"],"#ffa8a8,#f03e3e"],
["Gỏi tôm","🦐","Tôm tươi rói, ăn vào phơi phới!",["Chua ngọt cân bằng, ăn kèm món nóng rất hợp","Tôm ngọt thịt, rau củ giòn tươi","Ít dầu mỡ, ăn nhẹ bụng mà vẫn đã miệng"],"#b2f2bb,#37b24d"],
["Ngêu hấp Thái","🐚","Nghêu thì há miệng, anh em thì há hốc!",["Vị ngọt tự nhiên của ngêu hòa với sả, ớt, lá chanh","Bóc từng con, nhâm nhi vừa ăn vừa trò chuyện","Húp nước hấp nóng cay cho ấm bụng"],"#a5d8ff,#339af0"],
["Gà chiên nước mắm","🍗","Gà chiên mắm đậm đà, ngon hơn người yêu cũ thật thà!",["Nước mắm caramel quyện lớp da giòn, thơm nức","Hợp cả người khó tính, cả bàn đều gắp","Chắc bụng, lót dạ cho cuộc nhậu dài"],"#ffc9a0,#e8590c"],
["Trái cây tráng miệng","🍉","Chốt buổi nhậu nhẹ nhàng, tươi mát",["Thanh mát, giải ngán sau chuỗi món đậm vị","Bổ sung nước và vitamin cho cơ thể","Kết thúc buổi nhậu êm, dễ chịu"],"#fcc2d7,#e64980"],
["Heineken lùn","🍺","Dáng tuy hơi lùn, nhưng cuốn vô cùng!",["Vị êm, dễ uống, hợp với món chua cay đậm đà","Chai lùn nhỏ gọn, uống lạnh vừa đủ, không bị nhạt","Nhớ uống có chừng mực, về nhà an toàn"],"#d8f5a2,#74b816"]
];
var list=document.getElementById('list'),chips=document.getElementById('chips');
D.forEach(function(d,i){
var s=document.createElement('section');s.className='dish';s.id='mon'+(i+1);
var g=d[4].split(',');
s.innerHTML='<div class="art rv" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')"><span>'+d[1]+'</span></div>'+
'<div><div class="num rv">MÓN '+(i+1)+' / 8</div><h2 class="rv">'+d[0]+'</h2><p class="sub rv">'+d[2]+'</p><ul>'+d[3].map(function(r){return '<li class="rv">'+r+'</li>'}).join('')+'</ul></div>';
list.appendChild(s);
var b=document.createElement('button');b.className='chip';b.textContent=d[1]+' '+d[0];
b.onclick=function(){s.scrollIntoView({behavior:'smooth',block:'center'})};
chips.appendChild(b);
});
var els=document.querySelectorAll('.rv');
if('IntersectionObserver' in window){
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
els.forEach(function(e){io.observe(e)});
}else{els.forEach(function(e){e.classList.add('in')})}
var bar=document.getElementById('bar');
addEventListener('scroll',function(){var h=document.documentElement;var p=h.scrollTop/(h.scrollHeight-h.clientHeight);bar.style.width=(p*100)+'%'},{passive:true});
document.getElementById('cheer').onclick=function(){
var e=['🍺','🍻','🦐','🍗','🍉','🍲','🐚'];
for(var i=0;i<18;i++){(function(){var n=document.createElement('span');n.textContent=e[Math.floor(Math.random()*e.length)];
n.style.cssText='position:fixed;left:'+(Math.random()*95)+'vw;top:100vh;font-size:'+(28+Math.random()*36)+'px;z-index:30;pointer-events:none;transition:transform 2.2s ease-out,opacity 2.2s';
document.body.appendChild(n);
requestAnimationFrame(function(){n.style.transform='translateY(-'+(60+Math.random()*50)+'vh) rotate('+(Math.random()*360)+'deg)';n.style.opacity='0'});
setTimeout(function(){n.remove()},2300)})()}
};
</script>
</body>
</html>
